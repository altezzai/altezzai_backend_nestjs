name: Deploy Altezzai-nest-api

on:
  push:
    branches: ['prod']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy build, package files, and templates to VPS (temporary)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: 'dist,package.json,package-lock.json,templates'
          target: ${{ secrets.DEPLOY_PATH }}/_temp
          overwrite: true

      - name: Deploy and restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            node -v
            npm -v
            pm2 -v

            mkdir -p uploads
            rsync -av _temp/ ./
            rm -rf _temp

            npm ci --omit=dev
            pm2 restart altezzai-nest-api || pm2 start dist/main.js --name altezzai-nest-api